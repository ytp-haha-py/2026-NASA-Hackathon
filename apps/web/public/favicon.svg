<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest">
  <title>AnalogX</title>
  <rect width="64" height="64" rx="14" fill="#111111"/>
  <g transform="translate(32 32) rotate(-30)" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round">
    <!-- outer orbit, open where the orbiting body sits -->
    <ellipse rx="26" ry="12"/>
    <!-- inner orbit, drawn as an open arc so it reads as motion -->
    <path d="M-17 3.6A18 7.5 0 0 0 17 3.6"/>
    <!-- the planet, as a line -->
    <circle r="8" fill="#111111"/>
    <!-- the body being compared -->
    <circle cx="26" cy="0" r="7" fill="#111111" stroke="none"/>
    <circle cx="26" cy="0" r="4.6" fill="#f26b2a" stroke="none"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
