<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest">
  <title>AnalogX</title>
  <rect width="64" height="64" rx="14" fill="#111111"/>
  <g transform="translate(32 32) rotate(-18)">
    <!-- the whole ring, which the X then covers on its far side -->
    <ellipse rx="27" ry="8" fill="none" stroke="#ffffff" stroke-width="5"/>
  </g>
  <!-- the X: two solid legs with flat cuts, outlined in the ground colour so the ring passes behind -->
  <g fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="miter">
    <path d="M12 11h12.5L52 53H39.5Z"/>
    <path d="M39.5 11H52L24.5 53H12Z"/>
  </g>
  <g transform="translate(32 32) rotate(-18)" fill="none">
    <!-- near side of the ring, drawn over the X with a cut on each side -->
    <path d="M-21 5.02A27 8 0 0 0 21 5.02" stroke="#111111" stroke-width="10"/>
    <path d="M-21 5.02A27 8 0 0 0 21 5.02" stroke="#ffffff" stroke-width="5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
