<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest">
  <title>AnalogX</title>
  <defs>
    <!-- a ring seen at an angle: thin on the far side, full on the near side -->
    <path id="ring" fill-rule="evenodd" d="M-28 0A28 9.5 0 1 0 28 0A28 9.5 0 1 0-28 0ZM-21.5-1.8A21.5 5 0 1 0 21.5-1.8A21.5 5 0 1 0-21.5-1.8Z"/>
    <clipPath id="near"><rect x="-40" y="0" width="80" height="24"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#111111"/>
  <!-- far side of the ring: the A covers it -->
  <use href="#ring" transform="translate(32 37) rotate(-20)" fill="#ffffff"/>
  <!-- the A: flat apex, flat-cut legs; the ring is its crossbar -->
  <path d="M26 8h12l17 46H43L32 24 21 54H9Z" fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="miter"/>
  <!-- near side of the ring, passing in front of both legs -->
  <g transform="translate(32 37) rotate(-20)" clip-path="url(#near)">
    <use href="#ring" fill="#ffffff" stroke="#111111" stroke-width="5" paint-order="stroke"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
