<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest">
  <title>AnalogX</title>
  <defs>
    <!-- a ring seen at an angle: a fine line on the far side, a full stroke on the near side -->
    <path id="ring" fill-rule="evenodd" d="M-28 0A28 10 0 1 0 28 0A28 10 0 1 0-28 0ZM-23-1.7A23 6 0 1 0 23-1.7A23 6 0 1 0-23-1.7Z"/>
    <clipPath id="near"><rect x="-40" y="0" width="80" height="24"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#111111"/>
  <g transform="translate(32 33) rotate(-24)">
    <!-- far side of the ring -->
    <use href="#ring" fill="#ffffff"/>
    <!-- the planet, as a line; it hides the ring behind it -->
    <circle r="13" fill="#111111" stroke="#ffffff" stroke-width="3.6"/>
    <!-- a short highlight stroke on the planet -->
    <path d="M-6.5-4.5A8 8 0 0 1 0.5-8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <!-- near side of the ring, sweeping across the planet -->
    <g clip-path="url(#near)">
      <use href="#ring" fill="#ffffff" stroke="#111111" stroke-width="4.5" paint-order="stroke"/>
    </g>
    <!-- the body being compared, at the tip of the ring -->
    <circle cx="26.5" cy="-1.5" r="7.2" fill="#111111"/>
    <circle cx="26.5" cy="-1.5" r="4.8" fill="#f26b2a"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
