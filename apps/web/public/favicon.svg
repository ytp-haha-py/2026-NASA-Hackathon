<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest">
  <title>AnalogX</title>
  <rect width="64" height="64" rx="14" fill="#111111"/>
  <!-- far side of the orbit: the A covers it -->
  <g transform="translate(32 38) rotate(-14)">
    <ellipse rx="27" ry="7.5" fill="none" stroke="#ffffff" stroke-width="4.5"/>
  </g>
  <!-- the A: two flat-cut legs meeting at a flat apex; the orbit is its crossbar -->
  <path d="M26 9h12l17 45H43L32 24.5 21 54H9Z" fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="miter"/>
  <!-- near side of the orbit, passing in front of both legs -->
  <g transform="translate(32 38) rotate(-14)" fill="none">
    <path d="M-22 4.35A27 7.5 0 0 0 22 4.35" stroke="#111111" stroke-width="9.5"/>
    <path d="M-22 4.35A27 7.5 0 0 0 22 4.35" stroke="#ffffff" stroke-width="4.5"/>
    <!-- the body being compared, riding the orbit -->
    <circle cx="26.2" cy="-1.8" r="5.2" fill="#111111"/>
    <circle cx="26.2" cy="-1.8" r="3.4" fill="#f26b2a"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
