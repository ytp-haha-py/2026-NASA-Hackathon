catalog_version: 1.0.0
description: Source matrix for the Planetary Analog Explorer. A dataset is marked verified only when a
  validated manifest exists in this repository and its provenance fields were copied from that manifest
  or an official source. Planned and unverified sources carry no measurements and must not appear as observations.
status_legend:
  verified: Validated manifest exists; derived observations are committed.
  in_progress: Pipeline work exists but no validated manifest at this revision.
  not_verified: Source identified, access or validation not completed.
  planned: Interface-only; no pipeline, manifest, or measurement.
datasets:
