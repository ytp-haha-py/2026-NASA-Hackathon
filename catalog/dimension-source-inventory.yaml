inventory_version: "1.0.0"
description: >-
  Six-dimension source inventory for Earth, Moon and Mars. This is an audit of
  candidate and verified sources, not a claim that any unverified source is
  available, fetched, or scientifically comparable.
status_legend:
  availability:
    verified: A validated manifest and processed observations exist in this repository.
    accessible: Official access path/license checked, but no validated observation exists yet.
    identified: Product or provider identified; exact version/access not fully verified.
    planned: Interface/research plan only.
    unknown: Not yet determined.
    not_applicable: The dimension is not scientifically applicable to this body.
  data_status:
    existing_observed: Derived observations already exist in committed manifests.
    not_fetched: No source bytes were fetched for this inventory.
    unknown: Cannot determine without source verification.
  comparability:
    comparable: Validated same-support comparison exists.
    context_only: Useful Earth context/filter only; not a cross-body score.
    evidence_only: Evidence/reference display only; no numeric similarity.
    not_comparable: No defensible common method/support exists.
    unknown: Comparability not yet established.
dimensions:
  - code: D01
    name: Terrain & Landforms
    research_question: "地表具有什麼形狀？"
    subgroups: []
    research_classes: []
    baseline: "113 Earth, 18 Moon, 5 Mars observed terrain windows; five 90 m metrics + flat fraction"
    bodies:
      Earth:
        sources:
          - source_id: copernicus-dem-glo90
            provider: European Space Agency / Airbus Defence and Space (AWS Open Data mirror)
            product: COP-DEM_GLO-90-DGED
            url: https://registry.opendata.aws/copernicus-dem/
            license: Copernicus DEM GLO-90 free basis, Copernicus Contributing Mission Data Access Licence
            license_url: https://dataspace.copernicus.eu/explore-data/data-collections/copernicus-contributing-missions/collections-description/COP-DEM
            native_resolution: 3 arc-second (~90 m), EPSG:4326
            spatial_support: Bounded 1.98 km windows; global land tiles are available but not exhaustively indexed
            temporal_support: Copernicus DEM 2021 release; static
            depth_support: Surface only
            observation_kinds: [numeric]
            qa: Native nodata/valid-fraction checks; DSM includes vegetation/buildings
            availability: verified
            data_status: existing_observed
            comparability: comparable
            notes: "Existing five terrain metrics and flat fraction; 113 indexed windows."
            unknown_fields: []
          - source_id: esa-worldcover-2021-v200
            provider: ESA WorldCover / VITO
            product: ESA WorldCover 2021 v200
            url: https://esa-worldcover.org/en/data-access
            license: CC BY 4.0
            license_url: https://creativecommons.org/licenses/by/4.0/
            native_resolution: 10 m, EPSG:4326
            spatial_support: 3 x 3 degree COG tiles; sampled at indexed Earth windows
            temporal_support: 2021 annual epoch
            depth_support: Surface land cover only
            observation_kinds: [distribution]
            qa: Valid-pixel denominator; class fractions; 76.7% published overall accuracy
            availability: verified
            data_status: existing_observed
            comparability: context_only
            notes: "Earth land-cover context/filter only; not mineralogy and not a scored terrain feature."
            unknown_fields: []
      Moon:
        sources:
          - source_id: nasa-lola-south-pole
            provider: NASA GSFC PGDA / LRO-LOLA
            product: LOLA 5 m/pix south-pole surface DEM products (six sites)
            url: https://pgda.gsfc.nasa.gov/products/78
            license: NASA-led mission data (CC0-1.0 per NASA Science Data Portal); PGDA citation requested
            license_url: https://science.data.nasa.gov/about/license
            native_resolution: 5 m source; 90 m analysis
            spatial_support: 18 ROI windows; ROI-centred windows may overlap
            temporal_support: Static topography
            depth_support: Surface only
            observation_kinds: [numeric]
            qa: ~90% of 5 m pixels interpolated; published RMS Z/slope error ranges; no per-window uncertainty
            availability: verified
            data_status: existing_observed
            comparability: comparable
            notes: "Same terrain method/support as Earth; planetary projected frame, never WGS84."
            unknown_fields: []
      Mars:
        sources:
          - source_id: usgs-jezero-ctx-dem
            provider: USGS Astrogeology / NASA Mars 2020
            product: Mars 2020 Science Investigation CTX DEM Mosaic (Jezero)
            url: https://astrogeology.usgs.gov/search/map/mars_2020_jezero_crater_dem
            license: Public domain (US Government work), verify product page
            license_url: https://www.usgs.gov/information-policies-and-instructions/copyrights-and-credits
            native_resolution: 20 m source; 90 m analysis
            spatial_support: Five disjoint Jezero windows; not global Mars
            temporal_support: Static topography
            depth_support: Surface only
            observation_kinds: [numeric]
            qa: CRS radius discrepancy disclosed; vertical error not per-window verified
            availability: verified
            data_status: existing_observed
            comparability: comparable
            notes: "Only five Jezero CTX windows; no Mars global coverage."
            unknown_fields: []
