  - code: D03
    name: Thermal Environment
    research_question: "地表具有什麼溫度及熱物理環境？"
    subgroups: [surface_temperature, thermal_inertia]
    research_classes: []
    baseline: "61 D03 observations: 20 Earth NASA POWER context, 36 Moon Diviner brightness temperature, 5 Mars THEMIS thermal inertia; no kinetic temperature, diurnal rate or cross-body score"
    bodies:
      Earth:
        sources:
          - source_id: nasa-power-thermal-daily
            provider: NASA Langley Research Center / NASA POWER
            product: NASA POWER Daily Point API thermal parameters
            url: https://power.larc.nasa.gov/api/temporal/daily/point
            license: NASA POWER data are free and open; cite NASA POWER
            license_url: https://power.larc.nasa.gov/docs/services/api/
            native_resolution: approximately 0.5 x 0.625 degree
            spatial_support: Five Earth AOI point contexts; not a 1.98 km measurement
            temporal_support: Daily; pilot 2024-01-01 through 2024-01-07
            depth_support: near-surface air and skin temperature; not subsurface
            observation_kinds: [timeseries]
            qa: Fill/finite checks; model/reanalysis context; no thermal inertia derived
            availability: accessible
            data_status: existing_observed
            comparability: context_only
            notes: "Pilot: 5 AOIs, 20 timeseries observations (T2M, T2M_MAX, T2M_MIN, TS)."
            unknown_fields: []
          - source_id: nasa-mod11a2
            provider: NASA LP DAAC
            product: MOD11A2 Version 6.1 (8-day LST)
            url: https://ladsweb.modaps.eosdis.nasa.gov/missions-and-measurements/products/MOD11A2/
            license: not_verified
            license_url: not_verified
            native_resolution: ~1 km; 8-day composite
            spatial_support: not_verified
            temporal_support: 8-day daytime/nighttime and QA
            depth_support: Surface skin temperature
            observation_kinds: [numeric, timeseries]
            qa: QA layers exist; exact product access not verified
            availability: identified
            data_status: not_fetched
            comparability: unknown
            notes: "Candidate only; cloud/shadow/local-solar-time semantics must be preserved."
            unknown_fields: [license, spatial_support, qa]
      Moon:
        sources:
          - source_id: lro-diviner
            provider: NASA PDS Geosciences / LRO Diviner
            product: Diviner PCP average bolometric brightness temperature (240 m)
            url: https://pds-geosciences.wustl.edu/lro/lro-l-diviner-3-rdr-v1/lrodv_1001/data/derived_pcp/
            license: CC0-1.0 (NASA-led PDS data; no restrictive notice on the product page)
            license_url: https://science.data.nasa.gov/about/license
            native_resolution: 240 m/pixel
            spatial_support: 18 lunar reference windows; two local-time bins
            temporal_support: multi-year southern-summer composite per local-time bin (00:00-00:15, 12:00-12:15)
            depth_support: Surface brightness temperature (unit emissivity assumption)
            observation_kinds: [numeric]
            qa: No per-bin uncertainty; brightness temperature is not kinetic temperature
            availability: accessible
            data_status: existing_observed
            comparability: evidence_only
            notes: "Pilot: 36 observations; 26 detected, 7 no_coverage, 3 unknown. No diurnal rate or cross-body score."
            unknown_fields: []
      Mars:
        sources:
          - source_id: usgs-mars-themis-global-thermal-inertia
            provider: USGS Astrogeology Science Center / Arizona State University / NASA MDAP
            product: THEMIS-derived global thermal inertia mosaic, quantitative 32-bit
            url: https://astrogeology.usgs.gov/search/map/mars-themis-derived-global-thermal-inertia-mosaic
            license: Public domain (USGS Astrogeology access constraints); please cite authors
            license_url: https://astrogeology.usgs.gov/search/map/mars-themis-derived-global-thermal-inertia-mosaic
            native_resolution: 100 m/pixel; 24 tiles; 60S to 60N latitude
            spatial_support: 24 tiles of 30 x 60 degrees; no polar coverage beyond 60 degrees
            temporal_support: Apparent thermal inertia is time-independent by definition; per-tile acquisition/season metadata not validated
            depth_support: Upper few centimetres, apparent thermal inertia
            observation_kinds: [numeric]
            qa: Absolute accuracy ~20%; relative accuracy within one image ~10%; no per-pixel uncertainty layer
            availability: accessible
            data_status: existing_observed
            comparability: evidence_only
            notes: "Pilot: 5 Jezero apparent-thermal-inertia observations read from bounded tile blocks; ~20% absolute accuracy and no per-pixel uncertainty."
            unknown_fields: []
  - code: D04
    name: Water & Ice
    research_question: "地表／地下有哪些水與冰及觀測證據？"
    subgroups: [surface_water, subsurface_ice, hydration_evidence]
    research_classes: []
    baseline: "75 D04 observations: 20 Earth NASA POWER context, 53 Moon LP NS/Mini-RF evidence, 2 Mars HEND epithermal-flux evidence; no confirmed ice detection"
    bodies:
      Earth:
        sources:
          - source_id: nasa-power-water-daily
