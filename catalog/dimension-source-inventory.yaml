          - source_id: nasa-m3
            provider: NASA / PDS
            product: Moon Mineralogy Mapper (M3) spectral products
            url: https://pds-imaging.jpl.nasa.gov/volumes/m3.html
            license: not_verified
            license_url: not_verified
            native_resolution: not_verified
            spatial_support: not_verified
            temporal_support: not_verified
            depth_support: Surface spectral evidence
            observation_kinds: [detection, spectrum, evidence]
            qa: not_verified
            availability: identified
            data_status: not_fetched
            comparability: evidence_only
            notes: "Candidate only; no mineral abundance is claimed."
            unknown_fields: [license, native_resolution, spatial_support, temporal_support, qa]
      Mars:
        sources:
          - source_id: usgs-jezero-geologic-map
            provider: U.S. Geological Survey
            product: Geologic Map of Jezero Crater and Nili Planum, SIM 3464
            url: https://pubs.usgs.gov/publication/sim3464
            license: USGS-authored GIS public domain; third-party material excluded
