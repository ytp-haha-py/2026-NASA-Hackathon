            license: CC0-1.0 (NASA-led PDS data; no restrictive notice on the product page)
            license_url: https://science.data.nasa.gov/about/license
            native_resolution: 0.5 x 0.5 degree
            spatial_support: 12 native lunar cells covering the reference windows
            temporal_support: mission composite; not a time series
            depth_support: Near-surface water-equivalent hydrogen (wt%)
            observation_kinds: [numeric]
            qa: Single fill marker; no per-cell uncertainty; WEH is not confirmed ice
            availability: accessible
            data_status: existing_observed
            comparability: evidence_only
            notes: "Pilot: water-equivalent hydrogen wt% at native cells; no ice detection or abundance claim."
            unknown_fields: []
          - source_id: lro-minirf-global-cpr
            provider: NASA LRO Mini-RF (PDS Geosciences Node)
            product: Global CPR mosaic 128 ppd (LRO-L-MRFLRO-5-GLOBAL-MOSAIC-V1.0)
            url: https://pds-geosciences.wustl.edu/lro/lro-l-mrflro-5-global-mosaic-v1/lromrf_1001/data/128ppd/global_cpr_128ppd_simp_0c.img
            license: CC0-1.0 (NASA-led PDS data; no restrictive notice on the product page)
            license_url: https://science.data.nasa.gov/about/license
            native_resolution: 128 pixels/degree (~237 m/pixel)
            spatial_support: 12 native lunar windows covering the reference areas
            temporal_support: mosaic; no time series
            depth_support: Near-surface radar circular polarization ratio
            observation_kinds: [numeric]
            qa: CPR is a radar indicator, not an ice detection; no per-pixel uncertainty
            availability: accessible
            data_status: existing_observed
            comparability: evidence_only
            notes: "Pilot: bounded byte-range decoded CPR values; no confirmed ice detection."
            unknown_fields: []
      Mars:
        sources:
          - source_id: mars-odyssey-hend-epithermal
            provider: NASA 2001 Mars Odyssey HEND (PDS Geosciences Node GRS special products)
            product: HEND epithermal neutron flux ratio (hend_epithermal_020917)
            url: https://pds-geosciences.wustl.edu/ody/urn-nasa-pds-odyssey_grs_special/data/hend_epithermal_020917.tab
            license: CC0-1.0 (NASA-led PDS data; no restrictive notice on the product page)
            license_url: https://science.data.nasa.gov/about/license
            native_resolution: 4 x 4 degree cells
            spatial_support: 1 native Mars cell covering the Jezero reference areas
            temporal_support: mission composite; not a time series
            depth_support: Near-surface epithermal neutron flux (hydrogen proxy)
            observation_kinds: [numeric]
            qa: No Mars WEH or ice-fraction conversion; coarser than AOI windows
            availability: accessible
            data_status: existing_observed
            comparability: evidence_only
            notes: "Pilot: 2 HEND flux observations; no ice or abundance claim."
            unknown_fields: []
