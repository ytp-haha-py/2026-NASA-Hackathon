      - impact_geology
      - sedimentary_geology
      - aqueous_alteration
    baseline: "56 evidence-only D02 records (Earth 15, Moon 3, Mars 38): map units, process evidence, CRISM context and area fractions; zero verified quantitative minerals and no shareable Earth GLiM values"
    bodies:
      Earth:
        sources:
          - source_id: glim-global-lithology
            provider: University of Bonn / GLiM
            product: Global Lithological Map (GLiM)
            url: not_verified
            license: not_verified
            license_url: not_verified
            native_resolution: vector polygons; map scale varies
            spatial_support: Global land; exact version/coverage unknown
            temporal_support: not_verified
            depth_support: Surface geology
            observation_kinds: [category, distribution, process_evidence]
            qa: not_verified
            availability: identified
            data_status: not_fetched
            comparability: unknown
            notes: "Candidate source only; no download or measured coverage."
            unknown_fields: [url, license, license_url, version, temporal_support, qa]
          - source_id: nasa-emit-mineral
            provider: NASA JPL EMIT
            product: EMIT mineral identification products
            url: https://earth.jpl.nasa.gov/emit/data/data-products/
            license: not_verified
            license_url: not_verified
            native_resolution: not_verified
            spatial_support: not_verified
            temporal_support: not_verified
            depth_support: Surface mineral spectral evidence
            observation_kinds: [detection, spectrum, evidence]
            qa: not_verified
            availability: identified
            data_status: not_fetched
            comparability: evidence_only
            notes: "Candidate only; detection is not abundance and must retain spectral/QA semantics."
            unknown_fields: [license, native_resolution, spatial_support, temporal_support, qa]
      Moon:
        sources:
          - source_id: usgs-moon-unified-geologic-map
            provider: USGS Astrogeology
            product: Unified Geologic Map of the Moon GIS v2
            url: https://astrogeology.usgs.gov/search/map/Moon/Geology/Unified_Geologic_Map_of_the_Moon_GIS_v2/
            license: CC0; cite Fortezzo, Spudis and Harrel (2020)
            license_url: https://astrogeology.usgs.gov/search/map/Moon/Geology/Unified_Geologic_Map_of_the_Moon_GIS_v2/
            native_resolution: vector polygons; map scale 1:5,000,000
            spatial_support: One Shackleton ROI overlay; not global
            temporal_support: Static map
            depth_support: Surface geology
            observation_kinds: [category, process_evidence]
            qa: Geometry/topology and map-unit provenance retained; fine-scale frame alignment unverified
            availability: verified
            data_status: existing_observed
            comparability: evidence_only
            notes: "1 map unit and 1 process record exported to typed-v2; no mineral abundance."
