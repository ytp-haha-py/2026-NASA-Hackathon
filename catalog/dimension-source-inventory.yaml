            depth_support: surface/root-zone soil wetness; snow depth; not subsurface ice
            observation_kinds: [timeseries]
            qa: Fill/finite checks; model/reanalysis context; no extraction or ice-volume claim
            availability: accessible
            data_status: existing_observed
            comparability: context_only
            notes: "Pilot: 5 AOIs, 20 observations (surface/root-zone wetness, snow depth, precipitation)."
            unknown_fields: []
