catalog_version: "1.0.0"
product:
  name: Geomorpho90m
  resolution: 7.5 arc-second (~250 m)
  doi: 10.1594/PANGAEA.899135
  open_topography_doi: 10.5069/G91R6NPX
  documentation:
    - https://portal.opentopography.org/dataspace/dataset?opentopoID=OTDS.012020.4326.1
    - https://www.nature.com/articles/s41597-020-0479-6
    - https://www.spatial-ecology.net/docs/build/html/GEODATA/geomorpho90m/geomorpho90m.html
  license: CC BY 4.0
  license_url: https://creativecommons.org/licenses/by/4.0/
  native_crs: EPSG:4326
  native_resolution_arcsec: 7.5
  native_resolution_m_approx: 250
  coverage: "Global land approximately 60°S to 85°N; Antarctica excluded"
  temporal_support: static MERIT-DEM derivatives (v1.0, 2018)
  data_type: Int16; GeoTIFF tag Scale=0.01, Offset=0; nodata=-32768
  verified:
    documentation: true
    exact_url: true
    remote_range_read: true
    raster_bytes_fetched: false
    full_global_file_downloaded: false
    exact_remote_object_checksum: false
    scale_offset_verified: true
    nodata_verified: true
    block_layout_verified: true
    pilot_windows_processed: true
  licence_attribution: >-
    Geomorpho90m, Amatulli et al.; derived from MERIT-DEM; distributed under CC BY 4.0.
  source_note: >-
    The global slope COG was verified by HTTP range reads only. The full 4.8 GB object
    was never downloaded. Verified URL:
    https://hs.pangaea.de/Maps/DEM_Geomorpho90m/dtm_slope_merit.dem_m_250m_s0..0cm_2018_v1.0.tif
    Dimensions 172800 x 71698, EPSG:4326, 0.00208333 degree pixels, Int16, scale 0.01,
    nodata -32768, striped 1-row deflate blocks. A 3-region bounded pilot built 168 real
    5 km cells. ETag/checksum is not published by the archive; local window SHA-256 values
    are recorded in docs/GEOMORPHO_REAL_PILOT.md.
layers:
  - layer_id: dtm_slope_merit
    filename_candidate: dtm_slope_merit.dem_m_250m_s0..0cm_2018_v1.0.tif
    variable: slope
    expected_unit: degree
    use: "Primary coarse slope source; confirm unit/scale before use"
    status: verified_pilot_windows
  - layer_id: dtm_tri_merit
    filename_candidate: dtm_tri_merit.dem_m_250m_s0..0cm_2018_v1.0.tif
    variable: terrain_ruggedness_index
    expected_unit: unknown
    use: "Candidate only; native definition must be verified before aggregation"
    status: identified_not_fetched
  - layer_id: dtm_geom_merit
    filename_candidate: dtm_geom_merit.dem_m_250m_s0..0cm_2018_v1.0.tif
    variable: geomorphons
    expected_unit: categorical
    use: "Candidate only; 10-class semantics/buffer validation required before production"
    status: identified_not_fetched
pilot_regions:
  - region_id: sahara-tanezrouft
    bbox: {west: -2.0, south: 22.0, east: 2.0, north: 26.0}
  - region_id: alps
    bbox: {west: 8.0, south: 45.0, east: 12.0, north: 48.0}
  - region_id: grand-canyon
    bbox: {west: -113.0, south: 35.0, east: -111.0, north: 37.0}
go_no_go:
  go:
    - Documentation-level inventory and deterministic offline reader/grid/feature code
    - Bounded pilot after the maintainer authorizes a local staged file
  no_go:
    - Treating 250 m coarse slope/relief as the existing 90 m terrain metrics
    - Claiming global coverage: product excludes Antarctica and is a MERIT-DEM derivative
    - Assuming every Geomorpho archive supports free remote range reads
estimated_budget:
  slope_file_size_bytes: 5022223729
  slope_file_size_note: "Actual Content-Length for the global slope 250 m object (~4.8 GB); not downloaded in full."
  pilot_download: "No full download. Three 240x240 padded source windows were range-read and cached locally for the real pilot."
  pilot_regions_actual:
    - {region_id: pilot-sahara, bbox: {west: 10.0, south: 24.0, east: 10.4, north: 24.4}}
    - {region_id: pilot-alps, bbox: {west: 10.0, south: 45.0, east: 10.4, north: 45.4}}
    - {region_id: pilot-grand-canyon, bbox: {west: -112.2, south: 35.8, east: -111.8, north: 36.2}}
  storage_warning: "Do not fetch the full object; use bounded /vsicurl range reads. No CI download."
