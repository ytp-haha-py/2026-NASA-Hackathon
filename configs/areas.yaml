  status: indexed
  notes: 'Shackleton rim / lunar south pole window. ROI site04-roi2: Site04_ROIs.shp record 2; Site04_ROIs.dbf
    X/Y (-2757.5, -6342.5); official PGDA Site04_ROIs.tgz. Window centre in source map coordinates: X=-2757.5
    m, Y=-6342.5 m. Inverse-projected centre: lon=-156.502260, lat=-89.771925 (east-positive degrees;
    longitude is ill-conditioned this close to the pole, so the X/Y centre is authoritative). Analysis
    window 1980 m resampled bilinearly to 90 m; source crop 414 x 414 px at 5.0 m. window_checksum=sha256:33c5a1455df80de9c2bc2aadc4cdbf070dc544889df51486075196c45fbcf8c0.
    Extractor warnings: none. The 5 m LDEM is about 90% interpolated; do not treat 5 m texture as an independent
    measurement. The four metrics are computed from elevation in the source projected CRS. Citation: Barker,
    M.K., et al. (2021), Improved LOLA Elevation Maps for South Pole Landing Sites: Error Estimates and
    Their Impact on Illumination Conditions, Planetary & Space Science 203, 105119, doi:10.1016/j.pss.2020.105119.
    Flat fraction: slope <5 degrees / valid complete Horn neighborhoods, same 90 m grid; outer rim excluded.'
