registry_version: "1.0.0"
description: >-
  Versioned registry of known and indexed Areas of Interest (AOIs). Values are copied
  from validated pipeline manifests only. An area is listed as indexed only when its
  measurements exist in a committed manifest. Sparse 1.98 km analysis windows are local
  samples, not regional characterizations.
