[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "planetary-analog"
version = "0.1.0"
description = "Planetary Analog Explorer - transparent, evidence-based terrestrial analog search"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.36,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "numpy>=2.1,<3",
  "rasterio>=1.4,<2",
  "pyproj>=3.7,<4",
]

[project.optional-dependencies]
storage = ["boto3>=1.35,<2"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
  "jsonschema>=4.23,<5",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/analog_api", "pipelines/src/analog_pipelines"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "pipelines/tests", "pipelines/earth/tests", "pipelines/worldcover/tests", "pipelines/planetary/tests"]
addopts = "-q"
markers = [
  "network: tests that reach the public internet (deselected by default in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
